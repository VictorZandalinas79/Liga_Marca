name: Sync Live Matches

on:
  schedule:
    # RESPALDO, no el disparador principal.
    #
    # Esto estaba en '*/5 * * * *' y no funcionaba: contando las ejecuciones
    # reales, GitHub descartaba casi todos los huecos. De las 288 pasadas
    # diarias que pedía el cron se ejecutaban 56 unos días, 2 otros, y los
    # días 19, 20 y 21 de agosto de 2026 ninguna. Los crons de alta frecuencia
    # en el pool gratuito de GitHub no son fiables y no hay nada que tocar aquí
    # para arreglarlo: pedir 288 huecos al día es parte del motivo por el que
    # te descartan.
    #
    # El disparador de verdad es ahora pg_cron dentro de Supabase
    # (supabase/migrations/027_pg_cron_live_sync.sql), que llama cada 5 min al
    # workflow_dispatch de abajo. Este schedule se queda a 1/hora como red por
    # si esa vía se cayera.
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      fixture_ids:
        description: 'IDs de fixtures separados por coma (sincroniza solo esos)'
        required: false
        default: ''
      matchday:
        description: 'Jornada completa a sincronizar (número o nombre de fase)'
        required: false
        default: ''

# Evita solapes si una ejecución tarda más que el intervalo del cron.
#
# `cancel-in-progress: true` y no false, a propósito. Con false, el 12/09/2026
# el run #15869 se quedó atascado en `queued` (sin runner asignado) y retuvo el
# hueco del grupo: los ~100 disparos siguientes se apilaron en la única plaza
# pendiente cancelándose unos a otros, y el sync estuvo muerto más de una hora
# con el partido de las 19:00 congelado en el minuto 74. `timeout-minutes` no
# rescata de esto: ese reloj solo corre cuando el job ya está ejecutándose, así
# que un run encolado no caduca nunca.
#
# Con true, cada disparo nuevo cancela al anterior y ocupa su sitio, así que un
# run atascado no puede volver a bloquear la cola. Cancelar un sync a medias no
# pierde nada: trigger_descarga_eventos.py relee el feed de eventos entero y
# hace upsert, o sea que la siguiente pasada rehace el trabajo desde cero.
concurrency:
  group: sync-live
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    # Un run colgado bloquea el hueco de concurrencia; con disparos cada 5 min,
    # 10 min libera antes que los 15 anteriores.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: frontend-web/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run live sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SDAPI_OUTLET_KEY: ${{ secrets.SDAPI_OUTLET_KEY }}
          SYNC_FIXTURE_IDS: ${{ github.event.inputs.fixture_ids }}
          SYNC_MATCHDAY: ${{ github.event.inputs.matchday }}
        run: python ci/run_live_sync.py
      - name: Comprobar si empieza una jornada y enviar sanciones
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python "../5. check_inicio_jornada.py"

