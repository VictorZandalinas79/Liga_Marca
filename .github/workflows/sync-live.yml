name: Sync Live Matches

on:
  schedule:
    # Cada 5 min. El runner (ci/run_live_sync.py) sale enseguida si no hay
    # ningún partido en ventana, así que las ejecuciones vacías son baratas.
    # Ojo: los crons de GitHub se retrasan y a veces se saltan huecos; si se
    # quiere precisión, un cron externo (cron-job.org) llamando al
    # workflow_dispatch de abajo es más fiable y este schedule queda de respaldo.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      fixture_ids:
        description: 'IDs de fixtures separados por coma (sincroniza solo esos)'
        required: false
        default: ''
      matchday:
        description: 'Jornada completa a sincronizar (número o nombre de fase)'
        required: false
        default: ''

# Evita solapes si una ejecución tarda más que el intervalo del cron.
concurrency:
  group: sync-live
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Un run colgado bloquea el hueco de concurrencia; con disparos cada 5 min,
    # 10 min libera antes que los 15 anteriores.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: frontend-web/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run live sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SDAPI_OUTLET_KEY: ${{ secrets.SDAPI_OUTLET_KEY }}
          SYNC_FIXTURE_IDS: ${{ github.event.inputs.fixture_ids }}
          SYNC_MATCHDAY: ${{ github.event.inputs.matchday }}
        run: python ci/run_live_sync.py
      - name: Comprobar si empieza una jornada y enviar sanciones
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python "../5. check_inicio_jornada.py"

