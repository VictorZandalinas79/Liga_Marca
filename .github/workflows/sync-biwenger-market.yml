name: Biwenger Market Sync (Scraping & Prices)

on:
  schedule:
    # Lunes a las 06:30 UTC (después del core)
    - cron: '30 6 * * 1'
    # Cada 3 días a las 06:30 UTC
    - cron: '30 6 */3 * *'
  workflow_dispatch: {}

jobs:
  sync_market:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install "supabase>=2.0.0" "python-dotenv>=1.0.0" "requests>=2.31.0" "deep-translator>=1.11.0" "beautifulsoup4>=4.12.0"

      - name: Run Scraping Biwenger
        run: python "1.1 scraping_liga_2627.py"

      - name: Run Merge Players Data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python "merge_players_data.py"

      - name: Asignar y subir precios a Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python "asignar_precios.py"
          python "subir_precios_supabase.py"
