name: Biwenger Market Sync (Scraping & Prices)

# Se dispara al terminar API Core, no por cron propio: API Core repuebla
# players con todos los jugadores de la API y este workflow es el único que
# borra los que no están en Biwenger. Encadenarlos evita que la tabla se quede
# con sobrantes si los horarios se desfasan.
on:
  workflow_run:
    workflows: ["API Core Sync (Fixtures & Squads)"]
    types: [completed]
  workflow_dispatch: {}

jobs:
  sync_market:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # En workflow_run se ejecuta aunque el anterior falle; solo interesa
    # continuar si API Core terminó bien. El dispatch manual pasa siempre.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install "supabase>=2.0.0" "python-dotenv>=1.0.0" "requests>=2.31.0" "deep-translator>=1.11.0" "beautifulsoup4>=4.12.0"

      - name: Run Scraping Biwenger
        run: python "1.1 scraping_liga_2627.py"

      # Cruza Biwenger (posición, foto, precio) contra la tabla players de la
      # API por fecha de nacimiento, conservando el id de Opta y el resto de
      # datos que Biwenger no trae.
      - name: Run Merge Players Data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python "merge_players_data.py"

      # Recoge los que quedaron fuera del mercado en sincronizaciones anteriores
      # y no se pudieron borrar entonces por tener referencias (plantillas,
      # puntuaciones) que después desaparecieron —al vaciar player_scores entre
      # temporadas, por ejemplo—. Sin esto se quedaban en la tabla para siempre.
      # A quien esté en la plantilla de alguien no lo toca: se queda oculto.
      - name: Purge Players Out Of Biwenger
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python "limpiar_jugadores_fuera_biwenger.py" --aplicar

      # Los precios de Comunio (asignar_precios.py + subir_precios_supabase.py)
      # se quitaron de aquí: pisaban el 'price' que acaba de escribir el merge.
      # La fuente de precios es Biwenger. Los scripts siguen en el repo para
      # ejecutarlos a mano si hiciera falta.
