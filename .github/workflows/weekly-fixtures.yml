name: Weekly Fixtures & Squads Sync

on:
  schedule:
    # Lunes a las 06:00 UTC (08:00 en horario de verano de Madrid).
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        # El script solo necesita estas librerías (el resto del root requirements
        # incluye selenium/pandas que no hacen falta aquí y ralentizan el job).
        run: pip install "supabase>=2.0.0" "python-dotenv>=1.0.0" "requests>=2.31.0"

      - name: Run weekly fixtures sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SDAPI_OUTLET_KEY: ${{ secrets.SDAPI_OUTLET_KEY }}
        # Se ejecuta desde la raíz del repo, donde están settings.json y
        # jugadores_optimizados.csv que necesita el script.
        run: python "2. descarga_fixtures_y_sync.py"
