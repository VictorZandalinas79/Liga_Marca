<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liga Marca Fantasy</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: #333333;
            background-color: #f3f4f6;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .header {
            background-color: #1e3a8a;
            color: #ffffff;
            padding: 20px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 1px;
        }
        .content {
            padding: 30px 20px;
        }
        .footer {
            background-color: #f8fafc;
            color: #64748b;
            text-align: center;
            padding: 15px;
            font-size: 12px;
            border-top: 1px solid #e2e8f0;
        }
        .button {
            display: inline-block;
            background-color: #3b82f6;
            color: #ffffff !important;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 20px;
            text-align: center;
        }
        .greeting {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="cid:icono_lliga" alt="Icono Liga" style="height: 50px; vertical-align: middle; margin-right: 15px; border-radius: 8px;">
            <img src="cid:liga" alt="Liga Marca Fantasy" style="height: 50px; vertical-align: middle;">
        </div>
        <div class="content">
            <div class="greeting">¡Hola {{name}}!</div>
            
            {{CONTENT_BLOCK}}
            
        </div>
        <div class="footer">
            <p>Has recibido este correo porque estás registrado en la Liga Marca Fantasy.</p>
            <p>&copy; 2026 Liga Marca Fantasy. Todos los derechos reservados.</p>
        </div>
    </div>
</body>
</html>
