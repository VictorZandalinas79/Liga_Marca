<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liga Marca Fantasy</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: #333333;
            background-color: #f3f4f6;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border: 1px solid #e5e7eb;
        }
        .header {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #2563eb 100%);
            color: #ffffff;
            padding: 35px 20px 25px;
            text-align: center;
            border-bottom: 4px solid #f59e0b;
        }
        .header-logos {
            margin-bottom: 20px;
        }
        .header-logos img {
            height: 55px;
            vertical-align: middle;
            margin: 0 10px;
            border-radius: 8px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
        }
        .header h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .header h1 .highlight {
            color: #f59e0b;
        }
        .content {
            padding: 35px 30px;
        }
        .footer {
            background-color: #f8fafc;
            color: #64748b;
            text-align: center;
            padding: 20px;
            font-size: 13px;
            border-top: 1px solid #e2e8f0;
        }
        .button {
            display: inline-block;
            background-color: #3b82f6;
            color: #ffffff !important;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 20px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3);
            transition: background-color 0.2s;
        }
        .greeting {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 20px;
            color: #1e293b;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-logos">
                <img src="cid:icono_lliga" alt="Icono Liga">
                <img src="cid:liga" alt="Liga Marca Fantasy">
            </div>
            <h1>LIGA FANTÁSTICA VILAFRANCA <span class="highlight">INFORMA</span></h1>
        </div>
        <div class="content">
            <div class="greeting">¡Hola {{name}}!</div>
            
            {{CONTENT_BLOCK}}
            
        </div>
        <div class="footer">
            <p>Has recibido este correo porque estás registrado en la Liga Marca Fantasy.</p>
            <p>&copy; 2026 Liga Marca Fantasy. Todos los derechos reservados.</p>
        </div>
    </div>
</body>
</html>
