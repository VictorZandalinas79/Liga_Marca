<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Fondo blanco -->
  <rect width="100" height="100" fill="#ffffff" rx="50" />
  
  <!-- Autobús bien gordo, robusto y frontal/3D -->
  <!-- Sombra abajo -->
  <ellipse cx="50" cy="85" rx="36" ry="6" fill="#cbd5e1" opacity="0.6" />

  <!-- Ruedas gordas -->
  <rect x="14" y="66" width="16" height="16" rx="4" fill="#0f172a" />
  <rect x="70" y="66" width="16" height="16" rx="4" fill="#0f172a" />
  <circle cx="22" cy="74" r="4" fill="#64748b" />
  <circle cx="78" cy="74" r="4" fill="#64748b" />

  <!-- Carrocería principal (ancha, cuadrada y contundente) -->
  <rect x="16" y="20" width="68" height="58" rx="14" fill="#0284c7" />

  <!-- Franja superior / letrero de línea -->
  <rect x="28" y="24" width="44" height="7" rx="3" fill="#0f172a" />
  <text x="50" y="29.5" fill="#38bdf8" font-size="5" font-family="monospace" font-weight="900" text-anchor="middle">DEFENSA</text>

  <!-- Parabrisas panorámico grande -->
  <rect x="22" y="34" width="56" height="23" rx="7" fill="#0369a1" />
  <!-- Reflejo parabrisas -->
  <path d="M26 36 L44 36 L36 54 L24 54 Z" fill="#e0f2fe" opacity="0.45" />

  <!-- Parrilla central robusta -->
  <rect x="36" y="61" width="28" height="10" rx="3" fill="#0f172a" />
  <line x1="40" y1="64" x2="60" y2="64" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="40" y1="68" x2="60" y2="68" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />

  <!-- Faros redondos potentes -->
  <circle cx="26" cy="65" r="5" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5" />
  <circle cx="74" cy="65" r="5" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5" />

  <!-- Parachoques gordo -->
  <rect x="18" y="73" width="64" height="6" rx="3" fill="#1e293b" />
  <!-- Matrícula -->
  <rect x="43" y="74" width="14" height="4" rx="1" fill="#f8fafc" stroke="#334155" stroke-width="0.5" />
</svg>

